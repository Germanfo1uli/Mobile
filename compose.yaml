services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bugs
      POSTGRES_USER: bugs
      POSTGRES_PASSWORD: bugs
    ports:
      - "5432:5432"
    volumes:
      - bugs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugs -d bugs"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://bugs:bugs@postgres:5432/bugs
      DATABASE_SSL: "false"
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  bugs_postgres_data:
